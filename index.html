<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSE Math Quiz (5 Questions)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 35px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }
        h1 {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        .card {
            margin: 20px 0;
            padding: 20px;
            border-radius: 8px;
            text-align: left;
        }
        #question-box {
            border: 2px dashed #3498db;
            background-color: #fafbfc;
            font-size: 20px;
            line-height: 1.6;
        }
        .topic-tag {
            font-size: 12px;
            color: #3498db;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .input-section {
            margin: 25px 0;
            text-align: left;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #7f8c8d;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        input[type="text"]:focus {
            border-color: #3498db;
            outline: none;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            transition: background 0.2s;
        }
        #submit-btn { background-color: #2ecc71; }
        #submit-btn:hover { background-color: #27ae60; }
        #next-btn { background-color: #3498db; }
        #next-btn:hover { background-color: #2980b9; }
        
        #result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            display: none;
            text-align: left;
        }
        .correct { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .incorrect { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .hint {
            font-weight: normal;
            font-size: 14px;
            margin-top: 10px;
            color: #555;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>DSE Mathematics Quiz</h1>
    
    <div id="question-box" class="card">
        <div class="topic-tag">Get Started</div>
        <div>Click "Next Question" to load your first problem!</div>
    </div>

    <div class="input-section">
        <label for="user-answer">Type your final answer here (Do not use spaces):</label>
        <input type="text" id="user-answer" placeholder="e.g., (x-2)(x+3)" disabled>
        
        <div class="btn-group">
            <button id="submit-btn" disabled>Check Answer</button>
            <button id="next-btn">Next Question</button>
        </div>
    </div>

    <div id="result-box"></div>
</div>

<script>
    // 5 clean math questions with emoji-free text
    const questions = [
        { "topic": "Common Factors", "question": "Factorize: 6x^3y^2 - 9x^2y^3 + 3x^2y^2", "accepted": ["3x^2y^2(2x-3y+1)", "3y^2x^2(2x-3y+1)"], "solution": "3x^2y^2(2x - 3y + 1)" },
        { "topic": "Grouping Terms", "question": "Factorize: x^3 + 2x^2 + 3x + 6", "accepted": ["(x+2)(x^2+3)", "(x^2+3)(x+2)"], "solution": "(x + 2)(x^2 + 3)" },
        { "topic": "Difference of Squares", "question": "Factorize: 4x^4 - 25y^2", "accepted": ["(2x^2-5y)(2x^2+5y)", "(2x^2+5y)(2x^2-5y)"], "solution": "(2x^2 - 5y)(2x^2 + 5y)" },
        { "topic": "Difference of Cubes", "question": "Factorize: 8x^3 - 27y^3", "accepted": ["(2x-3y)(4x^2+6xy+9y^2)"], "solution": "(2x - 3y)(4x^2 + 6xy + 9y^2)" },
        { "topic": "Grouping over Integers", "question": "Factorize over integers: x^3 - 3x^2 - 9x + 27", "accepted": ["(x-3)^2(x+3)", "(x-3)(x-3)(x+3)", "(x+3)(x-3)^2"], "solution": "(x - 3)^2(x + 3)" }
    ];

    let currentItem = null;

    const questionBox = document.getElementById('question-box');
    const answerInput = document.getElementById('user-answer');
    const submitBtn = document.getElementById('submit-btn');
    const nextBtn = document.getElementById('next-btn');
    const resultBox = document.getElementById('result-box');

    nextBtn.addEventListener('click', () => {
        const randomIndex = Math.floor(Math.random() * questions.length);
        currentItem = questions[randomIndex];

        questionBox.innerHTML = `
            <div class="topic-tag">[Topic: ${currentItem.topic}]</div>
            <div style="font-weight: bold; margin-top: 5px;">${currentItem.question}</div>
        `;
        
        answerInput.value = '';
        answerInput.disabled = false;
        submitBtn.disabled = false;
        
        resultBox.style.display = 'none';
        resultBox.className = '';
        resultBox.innerHTML = '';
        answerInput.focus();
    });

    submitBtn.addEventListener('click', () => {
        if (!currentItem) return;

        const userClean = answerInput.value.replace(/\s+/g, '').toLowerCase();
        let isCorrect = false;
        
        for (let i = 0; i < currentItem.accepted.length; i++) {
            const systemClean = currentItem.accepted[i].replace(/\s+/g, '').toLowerCase();
            if (userClean === systemClean) {
                isCorrect = true;
                break;
            }
        }

        resultBox.style.display = 'block';
        if (isCorrect) {
            resultBox.className = 'correct';
            resultBox.innerHTML = '[CORRECT] Excellent work.';
        } else {
            resultBox.className = 'incorrect';
            resultBox.innerHTML = `
                [INCORRECT] Please try again.
                <div class="hint">
                    <b>Expected Form:</b> ${currentItem.solution}<br>
                    <i>Note: Do not type any spaces! Use ^ for powers.</i>
                </div>
            `;
        }
    });

    answerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !submitBtn.disabled) {
            submitBtn.click();
        }
    });
</script>

</body>
</html>
