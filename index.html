<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSE Math Factorization Drill</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }
        h1 {
            font-size: 26px;
            margin-bottom: 5px;
            color: #2c3e50;
        }
        .subtitle {
            color: #7f8c8d;
            margin-bottom: 35px;
            font-size: 15px;
        }
        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.2s;
        }
        #generate-btn {
            background-color: #3498db;
        }
        #generate-btn:hover {
            background-color: #2980b9;
        }
        #answer-btn {
            background-color: #2ecc71;
        }
        #answer-btn:hover {
            background-color: #27ae60;
        }
        #answer-btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        .display-card {
            margin: 20px auto;
            padding: 25px;
            border-radius: 8px;
            text-align: left;
            min-height: 80px;
        }
        #question-box {
            border: 2px dashed #3498db;
            background-color: #fafbfc;
            font-size: 22px;
            line-height: 1.6;
            color: #2c3e50;
        }
        #answer-box {
            border: 2px solid #2ecc71;
            background-color: #f9fdfa;
            font-size: 18px;
            line-height: 1.6;
            color: #27ae60;
            display: none;
        }
        .topic-tag {
            font-size: 13px;
            color: #3498db;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .ans-header {
            font-size: 14px;
            color: #2ecc71;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DSE Mathematics</h1>
        <div class="subtitle">Section A / Polynomial Factorization Drill</div>
        
        <div class="button-group">
            <button id="generate-btn">Next Question</button>
            <button id="answer-btn" disabled>Show Answer</button>
        </div>

        <div id="question-box" class="display-card" style="text-align: center; color: #7f8c8d;">
            Click "Next Question" to begin practicing.
        </div>

        <div id="answer-box" class="display-card"></div>
    </div>

    <script>
        // Use basic keyboard characters (^ for powers) to guarantee compatibility on all devices
        const questions = [
            {
                "topic": "Common Factors",
                "question": "Factorize:<br>6x^3y^2 - 9x^2y^3 + 3x^2y^2",
                "answer": "3x^2y^2(2x - 3y + 1)"
            },
            {
                "topic": "Grouping Terms",
                "question": "Factorize:<br>x^3 + 2x^2 + 3x + 6",
                "answer": "Group: (x^3 + 2x^2) + (3x + 6)<br>= x^2(x + 2) + 3(x + 2)<br>= (x + 2)(x^2 + 3)"
            },
            {
                "topic": "Difference of Squares",
                "question": "Factorize:<br>4x^4 - 25y^2",
                "answer": "(2x^2 - 5y)(2x^2 + 5y)"
            },
            {
                "topic": "Grouping & Difference of Squares",
                "question": "Factorize:<br>x^2 - 6xy + 9y^2 - 4z^2",
                "answer": "First three terms: (x - 3y)^2<br>Then: (x - 3y)^2 - (2z)^2<br>= (x - 3y - 2z)(x - 3y + 2z)"
            },
            {
                "topic": "Difference of Cubes",
                "question": "Factorize:<br>8x^3 - 27y^3",
                "answer": "(2x)^3 - (3y)^3<br>= (2x - 3y)(4x^2 + 6xy + 9y^2)"
            },
            {
                "topic": "Substitution & Quadratic Form",
                "question": "Factorize:<br>x^4 - 5x^2 + 4",
                "answer": "Let u = x^2:<br>u^2 - 5u + 4 = (u - 1)(u - 4)<br>= (x^2 - 1)(x^2 - 4)<br>= (x - 1)(x + 1)(x - 2)(x + 2)"
            },
            {
                "topic": "Factor Theorem & Cubic Factoring",
                "question": "Factorize completely:<br>2x^3 - 3x^2 - 8x + 12",
                "answer": "Test x = 2: 2(8) - 3(4) - 16 + 12 = 0 -> factor is (x - 2)<br>Divide: (x - 2)(2x^2 + x - 6)<br>Factor quadratic: 2x^2 + x - 6 = (2x - 3)(x + 2)<br>Answer: (x - 2)(2x - 3)(x + 2)"
            },
            {
                "topic": "Advanced Identity (Squares & Cubes)",
                "question": "Factorize completely:<br>x^6 - y^6",
                "answer": "Difference of squares first:<br>x^6 - y^6 = (x^3 - y^3)(x^3 + y^3)<br>Then sum/difference of cubes:<br>= (x - y)(x^2 + xy + y^2)(x + y)(x^2 - xy + y^2)"
            },
            {
                "topic": "Three Variables Identity",
                "question": "Factorize completely:<br>a^3 + b^3 + c^3 - 3abc",
                "answer": "Using identity:<br>= (a + b + c)(a^2 + b^2 + c^2 - ab - bc - ca)"
            },
            {
                "topic": "Factor Theorem (Quartic)",
                "question": "Factorize completely:<br>x^4 - 2x^3 - 7x^2 + 8x + 12",
                "answer": "Test x = 2 -> factor (x - 2)<br>Divide -> (x - 2)(x^3 - 7x - 6)<br>Test x = 3 on cubic -> factor (x - 3)<br>Divide -> (x - 2)(x - 3)(x^2 + 3x + 2)<br>= (x - 2)(x - 3)(x + 1)(x + 2)"
            },
            {
                "topic": "Grouping over Integers",
                "question": "Factorize over integers:<br>x^3 - 3x^2 - 9x + 27",
                "answer": "Group: (x^3 - 3x^2) - (9x - 27)<br>= x^2(x - 3) - 9(x - 3)<br>= (x - 3)(x^2 - 9)<br>= (x - 3)(x - 3)(x + 3)<br>= (x - 3)^2(x + 3)"
            },
            {
                "topic": "Completing the Square Strategy",
                "question": "Factorize completely:<br>x^4 + 4y^4",
                "answer": "Add & subtract 4x^2y^2:<br>= x^4 + 4x^2y^2 + 4y^4 - 4x^2y^2<br>= (x^2 + 2y^2)^2 - (2xy)^2<br>= (x^2 + 2y^2 - 2xy)(x^2 + 2y^2 + 2xy)<br>= (x^2 - 2xy + 2y^2)(x^2 + 2xy + 2y^2)"
            },
            {
                "topic": "Quartic Symmetric Splitting",
                "question": "Factorize:<br>x^4 + x^2 + 1",
                "answer": "Add & subtract x^2:<br>= x^4 + 2x^2 + 1 - x^2<br>= (x^2 + 1)^2 - x^2<br>= (x^2 + 1 - x)(x^2 + 1 + x)<br>= (x^2 - x + 1)(x^2 + x + 1)"
            },
            {
                "topic": "Cyclic Identity",
                "question": "Factorize:<br>a^2(b - c) + b^2(c - a) + c^2(a - b)",
                "answer": "Expand: a^2b - a^2c + b^2c - b^2a + c^2a - c^2b<br>= -(a - b)(b - c)(c - a)"
            },
            {
                "topic": "Symmetric Polynomial Identity",
                "question": "Factorize completely:<br>x^3 + y^3 + z^3 - 3xyz",
                "answer": "= (x + y + z)(x^2 + y^2 + z^2 - xy - yz - zx)"
            },
            {
                "topic": "Geometric Progression Method",
                "question": "Factorize completely:<br>x^5 + x^4 + x^3 + x^2 + x + 1",
                "answer": "Group pairs:<br>= x^4(x + 1) + x^2(x + 1) + 1(x + 1)<br>= (x + 1)(x^4 + x^2 + 1)<br>= (x + 1)(x^2 - x + 1)(x^2 + x + 1)"
            },
            {
                "topic": "Reciprocal Polynomial Method",
                "question": "Factorize:<br>x^4 - 6x^3 + 11x^2 - 6x + 1",
                "answer": "Let u = x + (1/x), then x^2 + (1/x^2) = u^2 - 2<br>Transforms into: u^2 - 6u + 9 = (u - 3)^2<br>Substituting back and multiplying x^2:<br>= (x^2 - 3x + 1)^2"
            },
            {
                "topic": "Rational Root / Factor Theorem",
                "question": "Factorize completely:<br>6x^3 - 11x^2 - 19x - 6",
                "answer": "Test x = 3 -> factor (x - 3)<br>Division -> (x - 3)(6x^2 + 7x + 2)<br>Factor quadratic: 6x^2 + 7x + 2 = (3x + 2)(2x + 1)<br>Answer: (x - 3)(3x + 2)(2x + 1)"
            },
            {
                "topic": "Cubic Polynomial Expansion Difference",
                "question": "Factorize:<br>(a + b + c)^3 - a^3 - b^3 - c^3",
                "answer": "Expanding yields:<br>= 3(a + b)(b + c)(c + a)"
            }
        ];

        let currentQuestion = null;

        document.getElementById('generate-btn').addEventListener('click', () => {
            const randomIndex = Math.floor(Math.random() * questions.length);
            currentQuestion = questions[randomIndex];
            
            document.getElementById('question-box').innerHTML = `
                <div class="topic-tag">[Topic: ${currentQuestion.topic}]</div>
                <div>${currentQuestion.question}</div>
            `;
            document.getElementById('question-box').style.textAlign = 'left';

            const answerBox = document.getElementById('answer-box');
            answerBox.style.display = 'none';
            answerBox.innerHTML = '';
            document.getElementById('answer-btn').disabled = false;
        });

        document.getElementById('answer-btn').addEventListener('click', () => {
            if (currentQuestion) {
                const answerBox = document.getElementById('answer-box');
                answerBox.innerHTML = `
