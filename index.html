<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DSE Math Drill</title>
</head>
<body style="text-align: center; padding-top: 50px; font-family: Arial;">

    <h1>DSE Math Factorization</h1>
    
    <button id="next-btn" style="padding: 10px 20px; font-size: 18px;">Next Question</button>
    
    <div id="box" style="margin-top: 30px; font-size: 24px; font-weight: bold; color: blue;">
        Click the button to show a question.
    </div>

    <script>
        const myQuestions = [
            "Factorize: 4x^4 - 25y^2",
            "Factorize: x^3 + 2x^2 + 3x + 6"
        ];

        document.getElementById('next-btn').addEventListener('click', function() {
            const index = Math.floor(Math.random() * myQuestions.length);
            document.getElementById('box').innerText = myQuestions[index];
        });
    </script>

</body>
</html>
